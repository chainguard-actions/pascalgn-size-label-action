name: Test basic usage - default sizes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run size-label-action with default sizes
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token
      - name: Assert action ran (may fail due to missing real GitHub context)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to either succeed or fail with an API error
          # (not a startup/configuration error). Both outcomes are acceptable
          # in a local act environment without a real GitHub token.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: action did not produce a valid outcome"
            exit 1
          fi
