name: Test basic usage - default sizes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create mock pull_request event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "additions": 10,
              "deletions": 5,
              "changed_files": 2
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (may fail due to fake token but should not crash with unexpected error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the token is fake and can't call GitHub API
          # but it should fail gracefully (not with a missing file or parse error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
