name: Test ignored action type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Overwrite event payload with ignored action type (labeled)
        run: |
          cat > "$GITHUB_EVENT_PATH" << 'EOF'
          {
            "action": "labeled",
            "pull_request": {
              "number": 1,
              "labels": [],
              "base": {
                "repo": {
                  "name": "test-repo",
                  "owner": {
                    "login": "test-owner"
                  }
                }
              }
            }
          }
          EOF
          echo "Overwrote event payload at $GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - name: Run action with ignored action type
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action succeeded (ignored action type exits 0)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (exit 0) for ignored action type, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly ignored non-PR action type"
