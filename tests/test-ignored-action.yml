name: Test ignored action type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Overwrite event payload with closed action type
        run: |
          cat > "$GITHUB_EVENT_PATH" << 'EOF'
          {
            "action": "closed",
            "pull_request": {
              "number": 1,
              "labels": [],
              "base": {
                "repo": {
                  "owner": {
                    "login": "test-owner"
                  },
                  "name": "test-repo"
                }
              }
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # action="closed" is not in ["opened","synchronize","reopened"]
        # so the action should log "Action will be ignored" and exit 0

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully for ignored action type"
