name: Test custom sizes input with ignored action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Overwrite event payload with closed action type
        run: |
          cat > "$GITHUB_EVENT_PATH" << 'EOF'
          {
            "action": "closed",
            "pull_request": {
              "number": 42,
              "labels": [],
              "base": {
                "repo": {
                  "owner": {
                    "login": "test-owner"
                  },
                  "name": "test-repo"
                }
              }
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: |
            {
              "0": "XS",
              "5": "S",
              "20": "M",
              "50": "L",
              "200": "XL",
              "500": "XXL"
            }

      - name: Assert action completed without error with custom sizes
        run: |
          echo "PASS: action completed successfully with custom sizes for ignored action type"
