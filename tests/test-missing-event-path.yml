name: Test missing pull_request field in event payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Overwrite event payload without pull_request field
        run: |
          cat > "$GITHUB_EVENT_PATH" << 'EOF'
          {
            "action": "opened"
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed with invalid event payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid event payload, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid event payload"
