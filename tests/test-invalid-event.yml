name: Test invalid event payload error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Overwrite event payload with missing pull_request field
        run: |
          # Overwrite the actual event file that the action will read
          cat > "$GITHUB_EVENT_PATH" << 'EOF'
          {
            "action": "opened",
            "not_a_pull_request": {}
          }
          EOF
          echo "Overwrote event file at: $GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed with invalid event payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid event payload, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid event payload"
